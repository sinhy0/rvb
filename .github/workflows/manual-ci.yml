name: Manual CI

on:
  workflow_dispatch:
    inputs:
      twitter:
        description: "Build Twitter"
        required: false
        type: boolean
        default: false
      instagram:
        description: "Build Instagram"
        required: false
        type: boolean
        default: false
      youtube:
        description: "Build YouTube"
        required: false
        type: boolean
        default: false
      youtube_music:
        description: "Build YouTube Music"
        required: false
        type: boolean
        default: false
      remove_apks:
        description: "Optional: APKs to remove from cache (space-separated, e.g. com.brave.browser-1.93.138-*.apk)"
        required: false
        type: string
        default: ""

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  prepare_config:
    runs-on: ubuntu-latest
    outputs:
      config_file: ${{ steps.prepare.outputs.config_file }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare selected applications
        id: prepare
        shell: bash
        env:
          SELECT_TWITTER: ${{ inputs.twitter }}
          SELECT_INSTAGRAM: ${{ inputs.instagram }}
          SELECT_YOUTUBE: ${{ inputs.youtube }}
          SELECT_YOUTUBE_MUSIC: ${{ inputs.youtube_music }}
        run: |
          set -euo pipefail

          cp .github/configs/config.manual.toml .github/configs/config.selected.toml

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/configs/config.selected.toml")
          text = path.read_text()
          text = re.sub(r'(?m)^enabled = true$', 'enabled = false', text)
          path.write_text(text)
          PY

          selected=0

          enable_section() {
            local section="$1"
            python3 - "$section" <<'PY'
          from pathlib import Path
          import sys
          import re

          section = sys.argv[1]
          path = Path(".github/configs/config.selected.toml")
          text = path.read_text()

          pattern = rf'(^\[{re.escape(section)}\]\n)(.*?)(?=^\[|\Z)'
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)

          if not match:
              raise SystemExit(f"Application section not found: [{section}]")

          block = match.group(0)
          block = re.sub(r'(?m)^enabled = false$', 'enabled = true', block, count=1)
          path.write_text(text[:match.start()] + block + text[match.end():])
          PY
          }

          if [[ "$SELECT_TWITTER" == "true" ]]; then
            enable_section "twitter-piko"
            selected=1
          fi

          if [[ "$SELECT_INSTAGRAM" == "true" ]]; then
            enable_section "instagram-piko"
            selected=1
          fi

          if [[ "$SELECT_YOUTUBE" == "true" ]]; then
            enable_section "youtube-morphe"
            selected=1
          fi

          if [[ "$SELECT_YOUTUBE_MUSIC" == "true" ]]; then
            enable_section "youtube-music-morphe"
            selected=1
          fi

          if [[ "$selected" -eq 0 ]]; then
            echo "::error::Select at least one application."
            exit 1
          fi

          echo "Selected applications:"
          awk '
            /^\[/ { section=$0 }
            /^enabled = true$/ { print "  " section }
          ' .github/configs/config.selected.toml

          echo "config_file=.github/configs/config.selected.toml" >> "$GITHUB_OUTPUT"

      - name: Upload selected config
        uses: actions/upload-artifact@v4
        with:
          name: selected-config
          path: .github/configs/config.selected.toml

  build_manual:
    needs: prepare_config
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      config_file: ${{ needs.prepare_config.outputs.config_file }}
      remove_apks: ${{ inputs.remove_apks }}
    secrets: inherit

  trigger_cleanup:
    needs: [build_manual]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_website_update:
    needs: [build_manual, trigger_cleanup]
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/update-website.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [build_manual]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "Manual CI"
    secrets: inherit
